# ABOUTME: Runs packport's quality gate in GitHub Actions.
# ABOUTME: Catches failures even when local pre-commit hooks are not installed.
name: CI

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - run: bun run hooks:validate
      - run: bun run check
